name: CD - Build, Push and Deploy
on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          platforms: linux/amd64
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/blog-backend:latest

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          platforms: linux/amd64
          push: true
          build-args: VITE_API_URL=${{ secrets.BACKEND_URL }}/api
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/blog-frontend:latest

      - name: Deploy backend to Render
        run: curl -fsS -X POST "${{ secrets.RENDER_BACKEND_HOOK }}"

      - name: Deploy frontend to Render
        run: curl -fsS -X POST "${{ secrets.RENDER_FRONTEND_HOOK }}"
