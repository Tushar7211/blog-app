services:
  mongo:
    image: mongo:7
    container_name: blog-mongo
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: blog-backend
    restart: always
    
    environment:
      - MONGO_URI=${MONGO_URI}
      - PORT=5000
    
    

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:5000/api
    container_name: blog-frontend
    restart: always
    ports:
      - "3000:8080"
    depends_on:
      - backend

volumes:
  mongo-data:
